name: win7-desktop-prebuilt

on:
  push:
  workflow_dispatch:

concurrency:
  group: win7-desktop-prebuilt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_WIN7_VERSION: "v40.2.0"
  ELECTRON_WIN7_DIST_URL: "https://github.com/e3kskoy7wqk/Electron-for-windows-7/releases/download/v40.2.0/dist.zip"
  ELECTRON_WIN7_DIST_SHA256: "ed4ebb022624ae38f764fcfc1dc1ce30fe2145298975d4c90e8d95412deeadea"

jobs:
  package-pi-desktop-win7:
    name: package PI-Desktop with prebuilt Win7 Electron
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout PI-Desktop repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Rust host-core binary
        run: cargo build --release --locked -p host-core

      - name: Download prebuilt Win7 Electron runtime
        run: |
          mkdir -p "$RUNNER_TEMP/electron-win7-runtime"
          curl --fail --location --retry 5 --retry-delay 5 \
            --output "$RUNNER_TEMP/electron-win7-runtime.zip" \
            "$ELECTRON_WIN7_DIST_URL"
          echo "$ELECTRON_WIN7_DIST_SHA256  $RUNNER_TEMP/electron-win7-runtime.zip" | sha256sum --check -
          if command -v unzip >/dev/null 2>&1; then
            unzip -q "$RUNNER_TEMP/electron-win7-runtime.zip" -d "$RUNNER_TEMP/electron-win7-runtime"
          else
            tar -xf "$RUNNER_TEMP/electron-win7-runtime.zip" -C "$RUNNER_TEMP/electron-win7-runtime"
          fi
          test -f "$RUNNER_TEMP/electron-win7-runtime/electron.exe"
          test -f "$RUNNER_TEMP/electron-win7-runtime/version"

      - name: Prepare workspace packages and bundle runtime
        run: |
          pnpm --filter '@pi-desktop/desktop^...' --fail-if-no-match build
          pnpm -C packages/agent-runtime bundle

      - name: Build Win7 desktop assets
        working-directory: apps/desktop
        env:
          PI_DESKTOP_TARGET_PLATFORM: win32
          PI_DESKTOP_TARGET_ARCH: x64
          PI_DESKTOP_WIN7: "1"
        run: pnpm run build

      - name: Package Win7 desktop (Dir & NSIS Installer)
        working-directory: apps/desktop
        run: pnpm run package:win7 both
        env:
          PI_DESKTOP_ELECTRON_DIST: ${{ runner.temp }}/electron-win7-runtime
          PI_DESKTOP_WIN7_TARGET: both

      - name: Write runtime provenance report
        working-directory: apps/desktop
        run: |
          pnpm run report:win7-runtime "$PI_DESKTOP_ELECTRON_DIST" --out dist/win7/prebuilt-runtime
          pnpm run report:win7-runtime dist/win7/win-unpacked --compare "$PI_DESKTOP_ELECTRON_DIST" --out dist/win7/prebuilt-runtime-comparison
        env:
          PI_DESKTOP_ELECTRON_DIST: ${{ runner.temp }}/electron-win7-runtime

      - name: Debug dist/win7 contents
        if: always()
        run: ls -la apps/desktop/dist/win7 || true

      - name: Upload Win7 desktop artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-desktop-win7-prebuilt-electron
          path: |
            apps/desktop/dist/win7/win-unpacked/**
            apps/desktop/dist/win7/*.exe
            apps/desktop/dist/win7/*.blockmap
            apps/desktop/dist/win7/*.json
            apps/desktop/dist/win7/*.md
          if-no-files-found: warn
